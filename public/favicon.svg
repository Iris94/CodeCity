<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan to Pink Retro Gradient -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2de2e6" />
      <stop offset="100%" stop-color="#f61d53" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cybernetic Hexagonal Outer Border -->
  <polygon points="256,35 465,145 465,367 256,477 47,367 47,145" 
           fill="none" 
           stroke="url(#cyber-grad)" 
           stroke-width="16" 
           filter="url(#neon-glow)" />

  <!-- Diagonal Tech Accents -->
  <line x1="140" y1="90" x2="200" y2="55" stroke="#2de2e6" stroke-width="8" filter="url(#neon-glow)" />
  <line x1="372" y1="422" x2="312" y2="457" stroke="#f61d53" stroke-width="8" filter="url(#neon-glow)" />

  <!-- Stylized "MH" Text Monogram -->
  <g filter="url(#neon-glow)">
    <!-- Letter M (Left Side) -->
    <path d="M 120,350 L 120,170 L 180,275 L 240,170 L 240,350" 
          fill="none" 
          stroke="#2de2e6" 
          stroke-width="32" 
          stroke-linecap="square" 
          stroke-linejoin="miter" />
          
    <!-- Letter H (Right Side) -->
    <path d="M 285,350 L 285,170 M 285,260 L 385,260 M 385,170 L 385,350" 
          fill="none" 
          stroke="#f61d53" 
          stroke-width="32" 
          stroke-linecap="square" 
          stroke-linejoin="miter" />
  </g>
</svg>
